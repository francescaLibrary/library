    <meta property="og:url" content="https://francescaLibrary.github.io/library/recensioni.html">

    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231C1917'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23FCFBF7' font-family='Georgia' font-style='italic'%3EP.%3C/text%3E%3C/svg%3E">

<body data-page="recensioni">
    <a class="skip-link" href="#contenuto">Salta al contenuto</a>
    <!-- Navbar -->
    <div id="navbar"></div>

    <main id="contenuto">
    <!-- Page Header LRB -->
    <header class="page-header page-header--center">
        <div class="container container-narrow">
            <span class="section-eyebrow">Diario di lettura</span>
            <h1 class="page-header-title">Recensioni</h1>
            <p class="page-header-subtitle">Tutti i libri letti, con note sincere</p>
            <div class="lrb-tabs" role="group" aria-label="Vista recensioni">
                <button type="button" class="lrb-tab is-active" data-tab="latest" aria-pressed="true">Ultime</button>
                <button type="button" class="lrb-tab" data-tab="best" aria-pressed="false">Migliori</button>
            </div>
        </div>
    </header>
    
    <!-- Filters & Content -->
    <section class="filters-section">
        <div class="container">
            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="filter-row">
                    <div class="filter-group">
                        <label class="filter-label" for="filter-genre">Genere</label>
                        <select class="filter-select" id="filter-genre">
                            <option value="">Tutti i generi</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="filter-rating">Voto</label>
                        <select class="filter-select" id="filter-rating">
                            <option value="">Tutti i voti</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="filter-year">Anno</label>
                        <select class="filter-select" id="filter-year">
                            <option value="">Tutti gli anni</option>
                        </select>
                    </div>
                    
                    <div class="filter-group filter-search">
                        <label class="filter-label" for="filter-search">Cerca</label>
                        <input type="text" id="filter-search" placeholder="Titolo o autore...">
                    </div>
                </div>
            </div>
            
            <!-- Results Info -->
            <div class="results-info">
                <span class="results-count" id="results-count">Caricamento...</span>
                <button type="button" class="link-arrow" id="surprise-btn">Un libro a sorpresa &rarr;</button>
                <div class="results-sort">
                    <label for="filter-sort">Ordina per:</label>
                    <select class="filter-select" id="filter-sort">
                        <option value="date-desc">Più recenti</option>
                        <option value="date-asc">Meno recenti</option>
                        <option value="rating-desc">Voto (decrescente)</option>
                        <option value="rating-asc">Voto (crescente)</option>
                        <option value="title-asc">Titolo (A-Z)</option>
                        <option value="title-desc">Titolo (Z-A)</option>
                    </select>
                </div>
            </div>
            
            <!-- Books Grid LRB -->
            <div class="book-grid lrb-grid" id="books-grid">
                <div class="loading">Caricamento libri...</div>
            </div>
        </div>
    </section>
    </main>
    
    <!-- Footer -->
    <div id="footer"></div>

    <noscript>
        <div class="container">
            <p style="padding:2rem 0">Questo sito richiede JavaScript per mostrare le recensioni. Intanto puoi sfogliare la <a href="libreria.html">libreria</a> o tornare alla <a href="index.html">home</a>.</p>
        </div>
    </noscript>
    
    <!-- JavaScript -->
    <script src="js/data-loader.js"></script>
    <script src="js/template-renderer.js"></script>
    <script src="js/component-loader.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
