<style>
:root{--navy:#1e2f4e;--blue:#2f6ea5;--cream:#f8f5ec;--ink:#2b2b2b;--line:#e7e0d1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;line-height:1.7}
.mast{border-bottom:3px double var(--navy);background:#fff;text-align:center;padding:1.2rem 1rem}
.mast a{color:var(--navy);text-decoration:none;font-size:1.4rem;font-weight:700}
.mast small{display:block;font-style:italic;font-weight:400;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
main{flex:1;max-width:640px;margin:0 auto;padding:3.5rem 1.5rem;text-align:center}
.eyebrow{font-family:Arial,sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
h1{color:var(--navy);font-weight:400;font-size:2.2rem;line-height:1.2;margin:.6rem 0 1rem}
p{margin-bottom:1rem}
.nav{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem}
.btn{font-family:Arial,sans-serif;font-size:.9rem;padding:.7rem 1.3rem;border-radius:3px;text-decoration:none;background:var(--navy);color:#fff}
.btn--ghost{background:transparent;color:var(--navy);border:1px solid var(--navy)}
footer{border-top:1px solid var(--line);background:#fff;text-align:center;padding:1.2rem;font-size:.9rem;color:#4a5a6e}
footer a{color:var(--blue);margin:0 .5rem}
</style>
</head>
<body>
<header class="mast"><a href="index.html">Pagine e Parole<small>Diario di lettura</small></a></header>
<main>
<p class="eyebrow">Errore 404</p>
<h1>Questa pagina non esiste</h1>
<p>Forse hai seguito un segnalibro smarrito. Torna al diario: le recensioni ti aspettano.</p>
<nav class="nav" aria-label="Pagine principali">
<a class="btn" href="index.html">Home</a>
<a class="btn btn--ghost" href="recensioni.html">Recensioni</a>
<a class="btn btn--ghost" href="libreria.html">Libreria</a>
</nav>
</main>
<footer>Pagine e Parole — Diario di lettura<br><a href="termini.html">Termini</a> · <a href="privacy.html">Privacy</a></footer>
</body>
</html>
